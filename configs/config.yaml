# ==============================================================================
# Ask_Med: Centralized System Configuration
# Evidence-Based Medical Question Answering System
# ==============================================================================

project:
  name: "Ask_Med"
  version: "1.0.0"
  description: "Evidence-Based Medical Question Answering with PubMed Grounding"

# ------------------------------------------------------------------------------
# Storage & Directory Paths
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  raw_dir: "data/raw"
  chroma_db_dir: "data/chroma_db"
  bm25_index_file: "data/bm25_index/bm25.pkl"
  eval_dataset_file: "data/eval/eval_dataset.json"
  eval_results_dir: "data/eval/results"

# ------------------------------------------------------------------------------
# Models Configuration (Local LLM, Embedding, Cross-Encoder Reranker)
# ------------------------------------------------------------------------------
models:
  ollama:
    base_url: "http://127.0.0.1:11434"   # Can be overridden via OLLAMA_HOST env var
    llm_model: "llama3.1:8b"             # Generative Medical Reasoning LLM
    embed_model: "nomic-embed-text"      # High-context Semantic Embedding Model
    temperature: 0.0                     # 0.0 ensures deterministic & grounded answers
    top_p: 0.9
    max_tokens: 512
    timeout_seconds: 300
  reranker:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: 5                             # Top N best passages passed to LLM

# ------------------------------------------------------------------------------
# Ingestion & Preprocessing Parameters
# ------------------------------------------------------------------------------
ingestion:
  chunk_size: 512                        # Tokens per chunk
  chunk_overlap: 128                     # Overlap tokens between consecutive chunks
  entrez_email: "huynhhoangtuvan11092006@gmail.com"  # Required by NCBI E-utilities API
  entrez_tool: "AskMed_EvidenceRAG"
  min_abstract_words: 30                 # Skip articles with truncated/empty abstract
  default_search_limit: 50

# ------------------------------------------------------------------------------
# Hybrid Retrieval & Fusion Parameters (RRF)
# ------------------------------------------------------------------------------
retrieval:
  collection_name: "medical_knowledge"
  dense_top_k: 30                        # Top results from ChromaDB (expanded for higher recall)
  sparse_top_k: 30                       # Top results from Rank-BM25 (expanded for higher recall)
  rrf_k: 60                              # Smoothing constant in Reciprocal Rank Fusion

# ------------------------------------------------------------------------------
# API Service (FastAPI) & UI (Streamlit)
# ------------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  api_prefix: "/api/v1"

ui:
  port: 8501

